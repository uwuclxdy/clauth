[package]
name = "clauth"
version = "0.14.1"
edition = "2024"
description = "Manage multiple Claude Code accounts, monitor 5h/7d usage with configurable auto-switch and delegation with an MCP plugin. CLI + TUI."
license = "MIT"
repository = "https://github.com/uwuclxdy/clauth"
homepage = "https://github.com/uwuclxdy/clauth"
readme = "README.md"
keywords = ["claude-code", "account-switcher", "usage-monitor", "mcp", "anthropic"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
toml = "1.1.2"
anyhow = "1.0.103"
dirs = "6.0.0"
ureq = "3.3.0"
self-replace = "1.5.0"
signal-hook = "0.4.4"
tempfile = "3.27.0"
libc = "0.2.186"
sha2 = "0.11.0"
minisign-verify = "0.2.5"
# CSPRNG bytes for the OAuth PKCE code_verifier + state (already in the tree
# transitively; pinned here as a direct dep). No unsafe in our crate.
getrandom = "0.4.3"
# Echo-off prompt for the API key in `clauth login --base-url/--api-key`, so the
# key never routes through argv / shell history / process listings. Cross-
# platform; no transitive deps beyond libc (already in the tree).
rpassword = "7"
# Local wall-clock stamps on the TUI's reset countdowns (`resets in 40m
# (21:20)`, issue #39) — std has no timezone. chrono already compiles in the
# tree via rmcp → schemars; only the `clock` feature is new, which adds
# `iana-time-zone` for the zone lookup. Its `unsafe` stays inside chrono.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io"] }
# Filesystem event watcher — drives credential/config reconcile off inotify /
# FSEvents instead of wall-clock polling. Non-recursive watches only.
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
# Multi-producer multi-consumer channels with select!. Already pulled in as a
# transitive dep of notify; pinned here so the watchdog loop can use
# crossbeam_channel::select! to multiplex events, fallback timer, and shutdown.
crossbeam-channel = "0.5"
# `time` is what `enable_all()` needs to arm the timer rmcp's service loop
# starts — without it the MCP server panics right after its first reply. It
# reaches the graph transitively via rmcp → tokio-util today; pinned here so a
# dependency dropping it fails the build instead of the stdio session.
tokio = { version = "1.52.3", features = ["rt", "io-std", "time"] }
regex = "1.13.1"
# CLI grammar + generated help. `wrap_help` is what keeps the command table and
# the per-subcommand prose wrapping to the real terminal width instead of the
# hand-padded block it replaced; it adds only `terminal_size` (rustix is already
# in the tree via crossterm).
clap = { version = "4.6.4", features = ["derive", "wrap_help"] }

# `clauth daemon --listen` (the TLS REST API). Every crate below is ALREADY in
# the tree via ureq; these lines only promote them to direct deps, so the
# listener costs no new download and nothing new for cargo-deny to vet.
#
# `default-features = false` is load-bearing: rustls' defaults select the
# aws-lc-rs provider, which would add a second crypto backend, a C toolchain to
# every build, and a license that is not on deny.toml's allowlist. `ring` is the
# provider ureq already builds, so pinning it keeps exactly one in the tree.
rustls = { version = "0.23.42", default-features = false, features = ["std", "ring", "tls12", "logging"] }
# PEM decoding for the lego certificate and key. Its `pem` module is
# unconditional, so this covers what rustls-pemfile would otherwise be needed
# for; `std` is what adds the read-from-file half of it.
rustls-pki-types = { version = "1.15.0", features = ["std"] }
# Request-head parsing for that server. Hand-rolling this is where the bugs are;
# httparse is in the tree via ureq-proto.
httparse = "1"
# Constant-time bearer-token comparison. Nothing in the crate compares secrets
# today — `update.rs`'s hex compare is explicitly marked as unsafe to reuse here.
subtle = "2.6"
# Hex for the token. Three ad-hoc `{b:02x}` loops already exist; don't add a fourth.
hex = "0.4"

# npm installs `claude` as a `.cmd` shim that Rust's bare `Command::new` can't
# resolve (no PATHEXT search); `which` finds it. Unix uses a bare lookup.
[target.'cfg(windows)'.dependencies]
which = "8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
